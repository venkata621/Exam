<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Teacher Dashboard</title><link rel="stylesheet" href="/style.css"><script src="/socket.io/socket.io.js"></script></head><body><main><header><h1>Teacher Monitoring Dashboard</h1><a href="/">Student page</a></header><section id="login" class="card"><h2>Teacher login</h2><input id="user" value="teacher" placeholder="Username"><input id="pass" type="password" placeholder="Password"><button id="signin">Sign in</button><p id="loginErr" class="err"></p></section><div id="dash" class="hidden"><section class="card"><h2>Create unique exam code</h2><input id="student" placeholder="Student name"><button id="make">Generate code (one use, 24 hours)</button><pre id="codeOut"></pre></section><section class="card"><h2>Live camera preview</h2><p>Student must consent and allow camera access. Video is live only, not recorded.</p><video id="video" autoplay playsinline></video><p id="live">Waiting for student…</p></section><section class="card"><div class="row"><h2>Attempts & results</h2><button id="refresh">Refresh</button><button id="logout">Log out</button></div><div id="attempts"></div></section><section class="card hidden" id="detail"><button id="close">Close report</button><div id="report"></div></section></div></main><script>
const $=x=>document.getElementById(x);let sock,pc;
async function req(url,opts={}){let r=await fetch(url,{headers:{"Content-Type":"application/json"},...opts}),j=await r.json();if(!r.ok)throw Error(j.error||"Failed");return j}
$("signin").onclick=async()=>{try{await req("/api/teacher/login",{method:"POST",body:JSON.stringify({username:$("user").value,password:$("pass").value})});$("login").classList.add("hidden");$("dash").classList.remove("hidden");load()}catch(e){$("loginErr").textContent=e.message}};
$("make").onclick=async()=>{try{let x=await req("/api/teacher/codes",{method:"POST",body:JSON.stringify({student:$("student").value||"Student"})});$("codeOut").textContent=`EXAM CODE: ${x.code}\nExpires: ${new Date(x.expires).toLocaleString()}\nShare this code with your student.`;load()}catch(e){$("codeOut").textContent=e.message}};
async function load(){let a=await req("/api/teacher/attempts");$("attempts").innerHTML=a.length?a.map(x=>`<div class="attempt"><span><b>${esc(x.student)}</b> · #${x.id}<br><small>${esc(x.status)} · ${new Date(x.started).toLocaleString()}</small></span><span>${x.result?x.result.correct+"/"+x.result.total+" · "+x.result.percentage+"%":""} <button data-id="${x.id}">Details / Monitor</button></span></div>`).join(""):"No attempts yet.";document.querySelectorAll("[data-id]").forEach(b=>b.onclick=()=>detail(+b.dataset.id))}
async function detail(id){let a=await req(`/api/teacher/attempts/${id}`);$("detail").classList.remove("hidden");let h=`<h2>${esc(a.student)} — Attempt ${a.id}</h2><h3>Status: ${esc(a.status)}</h3>`;h+="<h3>Activity log</h3>"+a.logs.map(l=>`<p>${esc(l.at)} — <b>${esc(l.event)}</b>: ${esc(l.details||"")}</p>`).join("");if(a.result){h+=`<h3>Score ${a.result.correct}/${a.result.total} · ${a.result.percentage}%</h3><p>Wrong: ${a.result.wrong} · Unanswered: ${a.result.unanswered}</p><h3>Topic performance</h3>`;h+=Object.entries(a.result.stats).map(([k,v])=>`<p>${esc(k)}: ${v.correct}/${v.total} correct</p>`).join("");h+="<h3>Every answer</h3>"+a.result.review.map(q=>`<article><b>Q${q.id} · ${esc(q.topic)}</b><pre>${esc(q.question)}</pre><p>Student: ${q.chosen===null?"Unanswered":esc(q.options[q.chosen])}</p><p>Correct: ${esc(q.options[q.answer])}</p><p>${esc(q.explanation||"")}</p><hr></article>`).join("")}$("report").innerHTML=h;
if(sock)sock.disconnect();sock=io();sock.emit("join-monitor",{attemptId:id,role:"teacher"});pc=new RTCPeerConnection({iceServers:[{urls:"stun:stun.l.google.com:19302"}]});pc.ontrack=e=>{$("video").srcObject=e.streams[0];$("live").textContent="Live camera connected"};pc.onicecandidate=e=>e.candidate&&sock.emit("signal",{kind:"ice",data:e.candidate});sock.on("peer-ready",p=>{if(p.role==="student")$("live").textContent="Student connected; waiting for camera negotiation…"});sock.on("signal",async p=>{if(p.from!=="student")return;if(p.kind==="offer"){await pc.setRemoteDescription(p.data);let answer=await pc.createAnswer();await pc.setLocalDescription(answer);sock.emit("signal",{kind:"answer",data:answer})}if(p.kind==="ice")try{await pc.addIceCandidate(p.data)}catch{}})}
function esc(x){return String(x??"").replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
$("refresh").onclick=load;$("close").onclick=()=>{$("detail").classList.add("hidden");if(sock)sock.disconnect();if(pc)pc.close();$("video").srcObject=null;$("live").textContent="Waiting for student…"};$("logout").onclick=async()=>{await fetch("/api/teacher/logout",{method:"POST"});location.reload()};
</script></body></html>
